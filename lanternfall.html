<title>Lanternfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Martian+Mono:wght@400;600&display=swap">
<style>
  :root {
    --night: #17142F;
    --ink: #0E0C22;
    --plum: #3A2A55;
    --plum-2: #2A2348;
    --stone: #5E5173;
    --wick: #FFB547;
    --ember: #FF6B3D;
    --mist: #D9D0F0;
    --mist-dim: #9A8FBF;
    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--mist);
    font-family: var(--mono); overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  button, input, select, textarea { font-family: var(--mono); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--wick); outline-offset: 2px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px 24px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 0;
    pointer-events: none; text-shadow: 0 1px 0 var(--ink);
  }
  .hud-level small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mist-dim); }
  .hud-level strong { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.2; }
  .stats { display: flex; gap: 20px; font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 4px; }
  .stats span { color: var(--mist-dim); }
  .stats b { color: var(--mist); font-weight: 600; margin-left: 6px; }
  .stats .lamps b { color: var(--wick); }
  .stats .open b { color: var(--ember); }

  .flash {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, 0); max-width: calc(100% - 32px);
    font-family: var(--display); font-size: clamp(20px, 4vw, 34px); color: var(--wick); text-align: center;
    text-shadow: 0 0 24px rgba(255,181,71,.5), 0 3px 0 var(--ink);
    pointer-events: none; opacity: 0; transition: opacity .35s ease, transform .35s ease; z-index: 30;
  }
  .flash.show { opacity: 1; transform: translate(-50%, -8px); }

  /* ---------- cards ---------- */
  .overlay {
    position: fixed; inset: 0; display: grid; align-items: center; justify-items: start;
    padding-block: 24px; padding-inline: max(16px, 8vw) 16px;
    background: linear-gradient(90deg, rgba(14,12,34,.9) 0%, rgba(14,12,34,.62) 48%, rgba(14,12,34,.05) 85%);
    overflow-y: auto; z-index: 10;
  }
  .card { max-width: 32rem; display: grid; gap: 18px; }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ember); }
  .card h1, .card h2 {
    margin: 0; font-family: var(--display); font-weight: 400; color: var(--wick); line-height: .92; text-wrap: balance;
    text-shadow: 0 0 36px rgba(255,181,71,.35), 0 5px 0 #7A3E1C;
  }
  .card h1 { font-size: clamp(56px, 11vw, 116px); letter-spacing: -.01em; }
  .card h2 { font-size: clamp(34px, 6vw, 58px); }
  .lede { margin: 0; font-size: 13px; line-height: 1.8; max-width: 40ch; }
  .keys { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 11px; color: var(--mist-dim); line-height: 2; }
  kbd {
    font-family: var(--mono); font-size: 10px; color: var(--mist);
    padding: 2px 6px; background: var(--plum); border-radius: 4px; box-shadow: 0 2px 0 var(--ink);
  }
  .tally { margin: 0; display: flex; gap: 32px; flex-wrap: wrap; }
  .tally div { display: grid; gap: 4px; }
  .tally dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mist-dim); }
  .tally dd { margin: 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tally .best dd { color: var(--wick); }
  .menu { display: grid; gap: 10px; justify-items: start; padding-top: 2px; }
  .go {
    font-family: var(--display); font-size: 20px; color: var(--ink);
    background: var(--wick); border: 0; border-radius: 6px; padding: 12px 22px 11px; cursor: pointer;
    box-shadow: 0 4px 0 #A8621E, 0 0 30px rgba(255,181,71,.3);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #A8621E; }
  .alt {
    font-size: 13px; color: var(--mist); background: transparent; cursor: pointer;
    border: 0; border-bottom: 2px solid rgba(217,208,240,.25); padding: 6px 2px;
  }
  .alt:hover { color: var(--wick); border-color: var(--wick); }

  /* ---------- level select ---------- */
  .panel {
    position: fixed; inset: 0; z-index: 10; overflow-y: auto;
    background: rgba(14,12,34,.9);
    padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, 5vw) calc(env(safe-area-inset-bottom, 0px) + 40px);
  }
  .panel header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto 8px; }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 5vw, 52px); color: var(--wick); text-shadow: 0 4px 0 #7A3E1C; }
  #sel-body { max-width: 1100px; margin: 0 auto; display: grid; gap: 28px; }
  .chapter h3 { margin: 0 0 12px; font-family: var(--display); font-weight: 400; font-size: 22px; display: flex; gap: 12px; align-items: baseline; }
  .chapter h3 span { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ember); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .lvl {
    text-align: left; cursor: pointer; color: var(--mist);
    background: var(--plum-2); border: 1px solid transparent; border-radius: 4px;
    padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 3px; align-items: baseline;
  }
  .lvl:hover { border-color: rgba(255,181,71,.5); }
  .lvl b { grid-row: span 3; font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--mist-dim); line-height: 1; min-width: 1.3em; }
  .lvl strong { font-size: 12px; font-weight: 600; }
  .lvl small { font-size: 10px; color: var(--mist-dim); }
  .lvl em { font-style: normal; font-size: 10px; color: var(--mist-dim); font-variant-numeric: tabular-nums; }
  .lvl.lit b, .lvl.lit em { color: var(--wick); }
  .customs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .customs li { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--plum-2); padding: 10px 14px; border-radius: 4px; }
  .customs strong { display: block; font-size: 12px; }
  .customs small { font-size: 10px; color: var(--mist-dim); }
  .customs span { display: flex; gap: 6px; }
  .empty { margin: 0; font-size: 12px; color: var(--mist-dim); }
  .mini { font-size: 11px; color: var(--mist); background: var(--plum); border: 0; border-radius: 4px; padding: 7px 11px; cursor: pointer; }
  .mini:hover { background: var(--stone); }
  .mini.go-mini { background: var(--wick); color: var(--ink); font-weight: 600; }
  .mini.danger:hover { background: #8A2F1E; }

  /* ---------- editor ---------- */
  .editor { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .ed-bar {
    pointer-events: auto; position: absolute; top: 0; left: 0; right: 0;
    background: rgba(14,12,34,.94); border-bottom: 1px solid var(--plum);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 8px; display: grid; gap: 8px;
  }
  .ed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 11px; color: var(--mist-dim); }
  .ed-row .brand { font-family: var(--display); font-size: 18px; color: var(--wick); margin-right: 4px; }
  .ed-row label { display: flex; align-items: center; gap: 6px; }
  .ed-row input[type="text"], .ed-row input[type="number"] {
    font-size: 12px; color: var(--mist); background: var(--plum-2); border: 1px solid var(--plum); border-radius: 4px; padding: 6px 8px;
  }
  .ed-row input[type="text"] { width: 12rem; }
  .ed-row input[type="number"] { width: 4.2rem; font-variant-numeric: tabular-nums; }
  .ed-row input[type="range"] { width: 90px; accent-color: var(--wick); }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .ed-palette { display: flex; gap: 4px; align-items: center; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .ed-group { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); padding: 0 4px 0 10px; white-space: nowrap; }
  .ed-group:first-child { padding-left: 0; }
  .ed-tool {
    display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer;
    font-size: 11px; color: var(--mist); background: var(--plum-2); border: 1px solid transparent; border-radius: 4px; padding: 5px 8px;
  }
  .ed-tool i { width: 14px; height: 14px; border-radius: 2px; display: grid; place-items: center; font-style: normal; font-size: 10px; color: var(--mist); box-shadow: inset 0 0 0 1px rgba(217,208,240,.2); }
  .ed-tool:hover { border-color: rgba(217,208,240,.3); }
  .ed-tool.on { border-color: var(--wick); color: var(--wick); background: rgba(255,181,71,.1); }
  .ed-foot {
    pointer-events: auto; position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    background: rgba(14,12,34,.9); font-size: 11px; color: var(--mist-dim);
    padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  #ed-status { color: var(--mist); }
  #ed-coords { font-variant-numeric: tabular-nums; }

  /* ---------- dialogs ---------- */
  dialog {
    color: var(--mist); background: var(--night); border: 1px solid var(--plum); border-radius: 6px;
    padding: 24px; width: min(30rem, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  dialog::backdrop { background: rgba(14,12,34,.7); }
  dialog h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 32px; color: var(--wick); }
  dialog p { margin: 0 0 16px; font-size: 12px; line-height: 1.7; color: var(--mist-dim); }
  .fields { display: grid; gap: 12px; margin-bottom: 20px; }
  .fields label { display: grid; grid-template-columns: 7rem 1fr; align-items: center; gap: 10px; font-size: 11px; color: var(--mist-dim); }
  .fields select, .fields input {
    font-size: 12px; color: var(--mist); background: var(--plum-2); border: 1px solid var(--plum); border-radius: 4px; padding: 7px 8px; min-width: 0;
  }
  .fields input[type="range"] { accent-color: var(--wick); padding: 0; }
  .seed-row { display: flex; gap: 6px; }
  .seed-row input { flex: 1; font-variant-numeric: tabular-nums; }
  .dlg-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .dlg-actions .go { font-size: 17px; padding: 10px 18px 9px; }
  textarea {
    width: 100%; box-sizing: border-box; height: 8rem; resize: vertical; margin-bottom: 14px;
    font-size: 11px; color: var(--mist); background: var(--plum-2); border: 1px solid var(--plum); border-radius: 4px; padding: 10px;
    user-select: text; -webkit-user-select: text; word-break: break-all;
  }

  /* ---------- touch ---------- */
  .touch {
    position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: end;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 18px); pointer-events: none; z-index: 4;
  }
  .touch .pad { display: flex; gap: 12px; }
  .touch button {
    pointer-events: auto; width: 68px; height: 68px; border-radius: 50%;
    border: 2px solid rgba(217,208,240,.35); background: rgba(23,20,47,.55); color: var(--mist); font-size: 20px; touch-action: none;
  }
  .touch button.jump { width: 84px; height: 84px; border-color: rgba(255,181,71,.6); color: var(--wick); font-size: 13px; }
  .touch button.on { background: rgba(255,181,71,.25); }
  .touch .pause { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 64px); right: 16px; width: 44px; height: 44px; font-size: 14px; }
  @media (pointer: coarse) { .touch:not([hidden]) { display: flex; } }
  @media (max-width: 560px) {
    .hud-level strong { font-size: 17px; }
    .stats { gap: 12px; font-size: 11px; }
    .overlay { background: rgba(14,12,34,.8); }
    .ed-actions { margin-left: 0; }
  }
</style>

<canvas id="game" aria-label="Lanternfall game"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-level"><small id="hud-num">Level 1</small><strong id="hud-name">First Light</strong></div>
  <div class="stats">
    <div class="lamps" id="hud-lamps-wrap"><span id="hud-lamps-label">Lanterns</span><b id="hud-lamps">0/0</b></div>
    <div><span>Time</span><b id="hud-time">0:00.0</b></div>
    <div><span>Falls</span><b id="hud-falls">0</b></div>
  </div>
</div>

<div class="flash" id="flash"></div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<section class="panel" id="select" hidden>
  <header><h2>Choose a level</h2><button class="alt" id="sel-back">Back to menu</button></header>
  <div id="sel-body"></div>
</section>

<section class="editor" id="editor" hidden>
  <div class="ed-bar">
    <div class="ed-row">
      <span class="brand">Editor</span>
      <label for="ed-name">Name <input type="text" id="ed-name" maxlength="40"></label>
      <label for="ed-w">Width <input type="number" id="ed-w" min="12" max="300"></label>
      <label for="ed-h">Height <input type="number" id="ed-h" min="10" max="200"></label>
      <label for="ed-dark">Darkness <input type="range" id="ed-dark" min="0" max="0.92" step="0.02"></label>
      <div class="ed-actions">
        <button class="mini go-mini" id="ed-play" type="button">Test play</button>
        <button class="mini" id="ed-check" type="button">Check</button>
        <button class="mini" id="ed-save" type="button">Save</button>
        <button class="mini" id="ed-gen" type="button">Generate</button>
        <button class="mini" id="ed-code" type="button">Share code</button>
        <button class="mini" id="ed-fit" type="button">Fit view</button>
        <button class="mini" id="ed-new" type="button">New</button>
        <button class="mini" id="ed-exit" type="button">Menu</button>
      </div>
    </div>
    <div class="ed-palette" id="ed-palette"></div>
  </div>
  <div class="ed-foot"><span id="ed-status"></span><span id="ed-coords"></span></div>
</section>

<dialog id="gen-dialog">
  <h2>Random map</h2>
  <p>Every map is checked so the start can reach each lantern and the door. The same seed always builds the same map.</p>
  <div class="fields">
    <label for="gen-shape">Direction
      <select id="gen-shape">
        <option value="right">Across, left to right</option>
        <option value="up">Upward climb</option>
        <option value="mixed" selected>Up and across</option>
      </select>
    </label>
    <label for="gen-size">Size
      <select id="gen-size">
        <option value="s">Small</option>
        <option value="m" selected>Medium</option>
        <option value="l">Large</option>
      </select>
    </label>
    <label for="gen-diff">Difficulty
      <select id="gen-diff">
        <option value="1">1 · beetles only</option>
        <option value="2">2 · + bats, lifts</option>
        <option value="3" selected>3 · + frogs, thornbacks</option>
        <option value="4">4 · + ember pots</option>
        <option value="5">5 · + wraiths</option>
      </select>
    </label>
    <label for="gen-seed">Seed <span class="seed-row"><input type="number" id="gen-seed" min="1"><button class="mini" id="gen-reseed" type="button">Shuffle</button></span></label>
  </div>
  <div class="dlg-actions">
    <button class="go" id="gen-play" type="button">Play it</button>
    <button class="alt" id="gen-edit" type="button">Open in editor</button>
    <button class="alt" id="gen-cancel" type="button">Cancel</button>
  </div>
</dialog>

<dialog id="code-dialog">
  <h2>Share code</h2>
  <p id="code-msg"></p>
  <textarea id="code-text" spellcheck="false" aria-label="Level code"></textarea>
  <div class="dlg-actions">
    <button class="go" id="code-copy" type="button">Copy</button>
    <button class="alt" id="code-load" type="button">Load pasted code</button>
    <button class="alt" id="code-cancel" type="button">Close</button>
  </div>
</dialog>

<div class="touch" id="touch" hidden>
  <button class="pause" id="t-pause" aria-label="Pause">❚❚</button>
  <div class="pad">
    <button id="t-left" aria-label="Walk left">◀</button>
    <button id="t-right" aria-label="Walk right">▶</button>
  </div>
  <div class="pad">
    <button id="t-down" aria-label="Drop through">▼</button>
    <button id="t-jump" class="jump" aria-label="Jump">JUMP</button>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/gen.js"></script>
<script src="js/levels-1.js"></script>
<script src="js/levels-2.js"></script>
<script src="js/editor.js"></script>
<script src="js/ui.js"></script>
